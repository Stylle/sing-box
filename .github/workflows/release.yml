name: Main

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: get ver
        run: |
          echo "$(cat *.sh | grep is_sh_ver=)" >> $GITHUB_ENV
          echo "old=$(git tag | tail -n1)" >> $GITHUB_ENV
      - name: test
        run: |
          bash -n install.sh sing-box.sh src/*.sh tests/*.sh
          bash tests/port-hopping-test.sh
          bash tests/hy2-obfs-test.sh
      - name: Native HY2 obfuscation acceptance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .tools/native
          gh api repos/SagerNet/sing-box/releases/tags/v1.14.4 > .tools/native/release.json
          asset=$(jq -cer '.assets[] | select(.name == "sing-box-1.14.4-linux-amd64.tar.gz")' .tools/native/release.json)
          digest=$(jq -er '.digest | select(startswith("sha256:")) | ltrimstr("sha256:")' <<< "$asset")
          curl -fL --retry 3 "$(jq -r '.browser_download_url' <<< "$asset")" -o .tools/native/core.tar.gz
          echo "$digest  .tools/native/core.tar.gz" | sha256sum -c -
          tar -xzf .tools/native/core.tar.gz --strip-components=1 -C .tools/native
          SINGBOX_TEST_BIN="$PWD/.tools/native/sing-box" node tests/hy2-obfs-native.cjs
      # - name: test
      #   if: env.is_sh_ver == env.old 
      #   run: |
      #     echo not found new version.
      #     exit 1
      - name: tar
        run: tar --exclude=.tools -zcvf code.tar.gz ./*
      - name: release
        uses: softprops/action-gh-release@v1
        with:
          files: code.tar.gz
          tag_name: ${{ env.is_sh_ver }}
